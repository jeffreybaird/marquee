name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5.0.5"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marquee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-build-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      # esbuild bundles without checking types, so the frontend is only
      # verified here. Runs after `mix deps.get`: LiveView's TypeScript
      # declarations and its ESM build come from deps/, not npm.
      - name: Install assets dependencies
        run: npm ci --prefix assets

      - name: Type-check assets
        run: npm run typecheck --prefix assets

      - name: Test assets (with coverage)
        run: npm run test:coverage --prefix assets

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run unit & integration tests (with coverage)
        run: mix coveralls --exclude e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/marquee_test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marquee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Select matching Chrome and ChromeDriver
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          # ChromeDriver checks beside itself first; Wallaby finds google-chrome on PATH.
          driver_chrome="$(dirname "$CHROMEDRIVER_PATH")/chrome"
          if [ "$CHROME_PATH" != "$driver_chrome" ]; then
            ln -sf "$CHROME_PATH" "$driver_chrome"
          fi
          sudo ln -sf "$CHROME_PATH" /usr/local/bin/google-chrome
          sudo ln -sf "$CHROMEDRIVER_PATH" /usr/local/bin/chromedriver
          google-chrome --version
          chromedriver --version

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-build-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Build assets
        run: mix assets.deploy

      - name: Run E2E tests
        run: mix test --only e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/marquee_test

      - name: Upload Wallaby screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wallaby-screenshots
          path: screenshots/
