app = "bobine-4-dvyq"
primary_region = "ams"
kill_signal = "SIGTERM"

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "bobine-4-dvyq.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # WebSocket-heavy workloads should not scale to zero or they will amplify
  # reconnect storms during cold starts. Keep machines warm and validate the
  # steady-state floor during load tests.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    # These are starting points for a websocket-heavy app. Validate them under
    # realistic watch-page load before raising either limit.
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
